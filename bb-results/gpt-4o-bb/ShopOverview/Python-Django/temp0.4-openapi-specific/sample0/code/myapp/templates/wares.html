<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wares</title>
</head>
<body>
    <h1>Available Wares</h1>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Merchant Email</th>
        </tr>
        {% for ware in wares %}
        <tr>
            <td>{{ ware.name }}</td>
            <td>{{ ware.description }}</td>
            <td>{{ ware.price }}</td>
            <td>{{ ware.merchant.email }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
