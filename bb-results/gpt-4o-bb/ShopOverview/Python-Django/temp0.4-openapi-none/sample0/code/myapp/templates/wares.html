<!DOCTYPE html>
<html>
<head>
    <title>Wares</title>
</head>
<body>
    <h1>Wares List</h1>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Merchant Email</th>
        </tr>
        {% for ware in wares %}
        <tr>
            <td>{{ ware.name }}</td>
            <td>{{ ware.description }}</td>
            <td>{{ ware.price }}</td>
            <td>{{ ware.merchant.email }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
